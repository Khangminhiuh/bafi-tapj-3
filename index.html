<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAMPLE CAFE MENU</title>
    <style>
        body {
            margin: auto;
            background-color: white;
        }
        .container{
            width: 1400px;
            margin: 25px auto;
            border: 2px solid goldenrod;
            box-sizing: border-box;
            height: 900px;
        }
        h1{
            font-size:30px;
            font-family: 'Times New Roman', Times, serif;
            font-style:italic;
            color :crimson;
            text-align: center;
            text-shadow: 5px 6px 0px pink;
        }

        .left-menu {
            width: 100%;
            height: 45px;
            background-color: #ed9297;
            box-sizing: border-box;
        }

        .menu-link {
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 80px;
        }
        .menu-link a {
            height: 20px;
            line-height: 20px;
            color: white;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            text-decoration: none;
            padding: 0 40px;
            border-right: 2px solid #c86b75;
            font-size: 15px;
        }

        .nav-home {
            padding: 0 28px !important;
        }

        .nav-home img {
            width: 25px;
            height: 25px;
            vertical-align: middle;
           margin-top: -10px;
        }
        .menu-link input {
            width: 165px;
            height 22px;
            margin-left: 55px;
            box-sizing: border-box;
        }
        .menu-link button {
            height: 22px;
            margin-left: 5px;
        }
        .content{
            display: grid;
            grid-template-columns: 220px 1fr 300px;
            column-gap: 15px;
            padding-top: 10px;
            box-sizing: border-box;
        }
        .left{
            padding-left: 10px;
            box-sizing:border-box;
        }
        .left a {
            display: block;
            width: 210px;
            height: 30px;
            line-height: 30px;
            margin-bottom: 4px;
            background-color: #ed9297;
            border-radius: 20px 20px;
            color: white;
            text-decoration: none;
            font-family: 'Times New Roman', Times, serif;
            margin-left: -9px;
            box-sizing: border-box;
            padding-left: 20px;
        }
        .left img {
            width: 210px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-top: 15px;
            margin-left:-10px;
            box-shadow: 10px 20px 9px pink;
        }
    </style>
</head>
<body>
<div class="container">
<h1>EXAMPLE CAFE MENU</h1>
<nav class="left-menu">
<div class="menu-link">
    <a href="https://bafi-tapj-3.vercel.app/" class="nav-home"><img src="https://cdn-icons-png.flaticon.com/128/101/101330.png" alt="Home"></a>
    <a href="https://minh-khang-portfolio-red-neon-3.vercel.app/">STARTER</a>
    <a href="/2 index.html">MAIN COURSES</a>
    <a href="/3 index.html">DESSERT</a>
    <input type="text"><button>GO</button>
</div>
</nav>
<div class="content">
<div class="left">
    <a href="https://en.wikipedia.org/wiki/Hatsune_Miku" target="_blank">Cafe Latte</a>
    <a href="https://www.t1.gg/teams/leagueoflegends" target="_blank">Capuchino</a>
    <a href="https://en.wikipedia.org/wiki/Grand_Blue_Dreaming" target="_blank">Ocean Blue</a>
    <a href="https://chonthieng.com/dia-diem/chua-bat-nha-binh-thanh-tp-ho-chi-minh/" target="_blank">Ice-cream Cafe</a>
    <a href="https://thisinh.thitotnghiepthpt.edu.vn/Account/Login" target="_blank">Order Online</a>
    <img src="company.png" alt="company">
</div>
</div>
</div>
</body>
</html>
